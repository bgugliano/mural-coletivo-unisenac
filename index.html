<script>
  const WEB_APP_URL = "1Oi0-H2dXCj4HY4Bkn-y-a_R09P7jpS1N";

  document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const input = document.getElementById('arquivoInput');
    const status = document.getElementById('msgStatus');
    const btn = document.getElementById('btnEnviar');
    const file = input.files[0];

    if (!file) return;

    status.style.color = "#555";
    status.innerText = "Enviando arquivo para o Drive...";
    btn.disabled = true;

    const reader = new FileReader();
    reader.onload = function() {
      const payload = {
        fileName: file.name,
        mimeType: file.type,
        fileData: reader.result
      };

      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          status.style.color = "green";
          status.innerText = "✓ Arquivo enviado com sucesso!";
          input.value = "";
        } else {
          status.style.color = "red";
          status.innerText = "Erro: " + data.message;
        }
      })
      .catch(err => {
        status.style.color = "red";
        status.innerText = "Erro ao conectar com o Drive.";
      })
      .finally(() => {
        btn.disabled = false;
      });
    };

    reader.readAsDataURL(file);
  });

  <script>
    const records = new Map();
    const activePreviewUrls = new Map();
    let sdkReady = false;

    const form = document.getElementById('photo-form');
    const authorInput = document.getElementById('author-name');
    const fileInput = document.getElementById('photo-file');
    const fileName = document.getElementById('file-name');
    const notice = document.getElementById('form-notice');

    const grid = document.getElementById('gallery-grid');
    const emptyState = document.getElementById('empty-state');
    const countElement = document.getElementById('photo-count');

    function setNotice(message, type) {
      notice.textContent = message;
      notice.className = 'notice' + (type ? ' ' + type : '');
    }

    function updateCount() {
      currentCount = records.size;
      countElement.textContent = currentCount + (currentCount === 1 ? ' fotografia' : ' fotografias');
      emptyState.classList.toggle('hidden', currentCount > 0);
    }

    function formatDate(isoDate) {
      return new Intl.DateTimeFormat('pt-BR', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      }).format(new Date(isoDate)).replace('.', '');
    }

    function angleFor(index) {
      const angles = [-2.5, 2.1, -1.3, 2.7, 1.2, -2, 2.4, -1.8];
      return angles[index % angles.length];
    }

    function createOrUpdateCard(record, index) {
      let card = grid.querySelector('[data-record-id="' + record.__backendId + '"]');

      if (!card) {
        const fragment = document.getElementById('photo-card-template').content.cloneNode(true);
        card = fragment.querySelector('article');
        card.dataset.recordId = record.__backendId;
        card.style.transform = 'rotate(' + angleFor(index) + 'deg)';
        grid.appendChild(fragment);
        card = grid.querySelector('[data-record-id="' + record.__backendId + '"]');
      }

      card.querySelector('.dynamic-author').textContent = record.author_name;
      card.querySelector('.dynamic-date').textContent = formatDate(record.created_at);

      const image = card.querySelector('.uploaded-preview');
      const unavailable = card.querySelector('.photo-unavailable');
      const previewUrl = activePreviewUrls.get(record.__backendId);

      if (previewUrl) {
        image.src = previewUrl;
        image.alt = 'Fotografia enviada por ' + record.author_name;
        image.classList.remove('hidden');
        unavailable.classList.add('hidden');
      } else {
        image.removeAttribute('src');
        image.removeAttribute('alt');
        image.classList.add('hidden');
        unavailable.classList.remove('hidden');
      }
    }

    function renderRecords(data) {
      const incoming = new Set();

      data
        .slice()
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .forEach((record, index) => {
          incoming.add(record.__backendId);
          records.set(record.__backendId, record);
          createOrUpdateCard(record, index);
        });

      [...grid.children].forEach((card) => {
        if (!incoming.has(card.dataset.recordId)) {
          const activeUrl = activePreviewUrls.get(card.dataset.recordId);
          if (activeUrl) URL.revokeObjectURL(activeUrl);
          activePreviewUrls.delete(card.dataset.recordId);
          records.delete(card.dataset.recordId);
          card.remove();
        }
      });

      updateCount();
    }

    const dataHandler = {
      onDataChanged(data) {
        renderRecords(data);
      }
    };

    async function initializeSheet() {
      const result = await window.dataSdk.init(dataHandler);
      if (result.isOk) {
        sdkReady = true;
      } else {
        setNotice('Não foi possível conectar o mural neste momento. Tente novamente.', 'error');
      }
    }

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      fileName.textContent = file ? file.name : 'Selecionar uma imagem';
      setNotice('', '');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const author = authorInput.value.trim();
      const file = fileInput.files[0];

      if (!author) {
        setNotice('Informe o nome da pessoa autora da fotografia.', 'error');
        authorInput.focus();
        return;
      }

      if (!file) {
        setNotice('Selecione uma fotografia para publicar.', 'error');
        fileInput.focus();
        return;
      }

      if (!file.type.startsWith('image/')) {
        setNotice('Escolha um arquivo de imagem válido.', 'error');
        return;
      }

      if (!sdkReady) {
        setNotice('O mural ainda está sendo preparado. Tente novamente em instantes.', 'error');
        return;
      }

      if (records.size >= 999) {
        setNotice('O mural chegou ao limite de 999 fotografias. Remova uma entrada antes de adicionar outra.', 'error');
        return;
      }

      submitButton.disabled = true;
      setNotice('Colando sua fotografia no mural...', '');

      const createdAt = new Date().toISOString();
      const previewUrl = URL.createObjectURL(file);
      const record = {
        author_name: author,
        image_url: file.name,
        created_at: createdAt
      };

      const result = await window.dataSdk.create(record);

      if (result.isOk) {
        const temporaryRecord = {
          __backendId: 'local-' + Date.now(),
          ...record
        };

        activePreviewUrls.set(temporaryRecord.__backendId, previewUrl);
        records.set(temporaryRecord.__backendId, temporaryRecord);
        createOrUpdateCard(temporaryRecord, records.size - 1);
        updateCount();

        form.reset();
        fileName.textContent = 'Selecionar uma imagem';
        setNotice('Fotografia publicada no mural!', 'success');

        setTimeout(() => {
          const temporaryCard = grid.querySelector('[data-record-id="' + temporaryRecord.__backendId + '"]');
          if (temporaryCard && records.has(temporaryRecord.__backendId)) {
            temporaryCard.remove();
            records.delete(temporaryRecord.__backendId);
            activePreviewUrls.delete(temporaryRecord.__backendId);
            updateCount();
          }
        }, 12000);
      } else {
        URL.revokeObjectURL(previewUrl);
        setNotice('Não foi possível publicar a fotografia. Tente novamente.', 'error');
      }

      submitButton.disabled = false;
    });

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initializeSheet();
    });
  </script>
 </body>
</html>
